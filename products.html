<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Products</title>

  <link rel="stylesheet" href="./css/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <script src="./js/products-api.js" defer></script>
</head>

<body>
  <header>
    <a href="index.html">
      <img src="RainyDays_Logo.png" alt="Rainy Days Logo" class="logo" />
    </a>
    <form action="#" method="get" class="header-container">
      <!-- Kopier til alle html -->
      <input type="text" placeholder="Search for products..." id="search" />
    </form>
    <div class="header-icons">
      <input type="checkbox" id="menu-toggle" />
      <div class="mobile-icons">
        <a href="construction.html" class="icon-container" aria-label="My account">
          <i class="fa-solid fa-circle-user"></i>
          <span>My account</span>
        </a>
        <a href="cart.html" class="icon-container" aria-label="My cart">
          <i class="fa-solid fa-cart-shopping"></i>
          <span>My cart</span>
        </a>
        <label for="menu-toggle" class="hamburger">&#9776;</label>
        <label for="menu-toggle" class="close">&#10006;</label>
      </div>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="products.html">Women</a></li>
        <li><a href="products.html">Men</a></li>
        <li><a href="products.html">SALE</a></li>
        <li><a href="index.html">About us</a></li>
      </ul>
    </div>
  </header>
  <nav>
    <a href="products.html" class="final-sale">FINAL SALE! Up to 70% off</a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="products.html">Women</a></li>
      <li><a href="products.html">Men</a></li>
      <li><a href="products.html">SALE</a></li>
      <li><a href="index.html">About us</a></li>
    </ul>
  </nav>
  <main class="products-page">
    <h1>Men's Collection</h1>
    <div class="dropdown">
      <label for="sortBy">Sort by</label>
      <select name="Sort by" id="sortBy">
        <option value="popular">Most popular</option>
        <option value="size">Newest</option>
        <option value="lowPrice">Price: Low to high</option>
        <option value="highPrice">Price: High to low</option>
      </select>
      <label for="filterBy">Filter</label>
      <select name="filter" id="filterBy">
        <option value="all">Show all</option>
        <option value="new">New arrivals</option>
        <option value="sale">On Sale</option>
      </select>
    </div>
    <p class="page-status" data-product-count></p>
    <section class="product-selection">
      <section class="product-grid">
        <div class="product-cards" data-product-grid></div>
      </section>
      <div class="page-navigation">
        <ul>
          <li><a href="#">1</a></li>
          <li><a href="construction.html">2</a></li>
          <li><a href="construction.html">3</a></li>
          <li><a href="construction.html">...</a></li>
          <li><a href="construction.html">10</a></li>
        </ul>
      </div>
  </main>
  <footer>
    <div class="footer-left">
      <a href="index.html">Contact us</a>
    </div>
    <!-- Icons facebook, X, Instagram -->
    <div class="footer-right">
      <p>Follow us:</p>
      <a href="https://facebook.com" aria-label="Follow us on Facebook">
        <i class="fa-brands fa-facebook-f"></i>
      </a>
      <a href="https://x.com/">
        <i class="fa-brands fa-x-twitter" aria-label="Follow us on X"></i>
      </a>
      <a href="https://instagram.com">
        <i class="fa-brands fa-instagram" aria-label="Follow us on Instagram"></i>
      </a>
    </div>
  </footer>
</body>

</html>
